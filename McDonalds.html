<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>McDonald's Index Page</title>
		 <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #fff8f0;
      color: #333;
      scroll-behavior: smooth;
    }
 header {
      background-color: #d62300;
      color: white;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
	nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #ffcc00;
      color: #000;
    }

    section {
      padding: 80px 20px;
      min-height: 100vh;
    }
.hero {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                  url('https://images.unsplash.com/photo-1550317138-10000687a72b?auto=format&fit=crop&w=1200&q=80') center/cover;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }
	.btn {
      background-color: #ffcc00;
      color: #000;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #ffd633;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
.card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }
 .card-content h3 {
      margin-bottom: 10px;
      color: #d62300;
    }

    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .hero h2 {
        font-size: 2rem;
      }

      nav {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
 <!-- Header & Navigation -->
  <header>
    <h1>McDonald's</h1>
    <nav>
      <a href="#McDonalads">Home</a>
      <a href="https://www.mcdonalds.co.za/">Menu</a>
    </nav>
  </header>

  <!-- Home Section -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h2>Welcome to McDonald's</h2>
      <p>Enjoy delicious burgers, crispy fries, and refreshing drinks anytime.</p>
      <a href="https://www.mcdonalds.co.za/" class="btn">View Menu</a>
    </div>
